# Replay configuration. Anything omitted falls back to the defaults in replay_producer.py.
# CLI flags override this file.  Copy the ENTIRE file into runs/<run_id>/manifest.json (done automatically).
run:
  label: baseline            # A_fixed_sarima | B_fixed_lstm | C_adaptive | baseline
source:
  path: data/processed/uci_minute.parquet
  split: test                # train | val | test | all   (or set start/end ISO times)
meters: 1                    # >1 = virtual meters (load amplification, partition spread)
profile:
  mode: rate                 # rate | ramp | speedup | max
  rate_rps: 500              # base-paper rate
  speedup: 1800              # event-time compression for mode=speedup (1 = real time)
  ramp:                      # mode=ramp: start at 500 rec/s, +500 every 30 s, cap at max_rps
    start_rps: 500
    step_rps: 500
    step_every_s: 30
    max_rps: 5000
kafka:
  topic: energy.raw
  producer:
    acks: "1"
    linger.ms: 5
    compression.type: lz4
    batch.num.messages: 10000
    queue.buffering.max.messages: 500000
