[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-energy-pipeline"
version = "1.0.0"
description = "Data / platform / integration layer for the Adaptive Real-Time Energy Pipeline capstone"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "pyyaml>=6",
  "jsonschema>=4.18",
  "confluent-kafka>=2.3",
  "influxdb-client>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cap-prepare   = "capstone.prepare_data:main"
cap-synth     = "capstone.synthetic:main"
cap-topics    = "capstone.topics:main"
cap-replay    = "capstone.replay_producer:main"
cap-hourly    = "capstone.aggregator:main"
cap-monitor   = "capstone.monitor:main"
cap-probe     = "capstone.latency_probe:main"
cap-archive   = "capstone.archive:main"
cap-benchmark = "capstone.benchmark:main"
cap-train     = "capstone.forecasting.train:main"
cap-forecast  = "capstone.forecasting.forecaster:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capstone = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
