# ---------------------------------------------------------------------------
# Base ingestion path (Im et al. 2024, Sec. 4.1):  Kafka -> parse -> transform -> reconstruct -> InfluxDB
#
#   parse        json_v2 decodes the JSON string in each Kafka message
#   transform    event_time (ISO-8601 string) -> InfluxDB timestamp; numbers -> typed fields
#   reconstruct  nested {"features": {...}} is flattened into one measurement row per reading
#
# Validate offline (no broker needed):  telegraf --test --config telegraf.conf   (see docs/RUNBOOK.md and tools/parser_check.py)
# ---------------------------------------------------------------------------
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  collection_jitter = "0s"
  # The base paper found a 1 s flush interval gave the fastest end-to-end processing
  # (35.33 s @10 s -> 12.84 s @5 s -> 0.39 s @1 s for 10,000 records). Tune this in the
  # report's Telegraf-configuration experiment; keep it identical across A/B/C.
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = true

# ------------------------------------------------------------- raw readings
[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BOOTSTRAP}"]
  topics = ["energy.raw"]
  consumer_group = "${TELEGRAF_CONSUMER_GROUP}"
  offset = "oldest"
  max_message_len = 1000000
  max_undelivered_messages = 10000      # offsets are committed only after InfluxDB accepted the batch
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "energy_raw"
    timestamp_path = "event_time"                    # EVENT time, not arrival time
    timestamp_format = "2006-01-02T15:04:05Z07:00"
    timestamp_timezone = "UTC"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "meter_id"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "run_id"

    # Missing minutes have NO target/features keys -> optional = true keeps the point
    # (is_missing=true, seq, replay_time_ms) instead of erroring.
    [[inputs.kafka_consumer.json_v2.field]]
      path = "target"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.global_reactive_power"
      rename = "global_reactive_power"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.voltage"
      rename = "voltage"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.global_intensity"
      rename = "global_intensity"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.sub_metering_1"
      rename = "sub_metering_1"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.sub_metering_2"
      rename = "sub_metering_2"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "features.sub_metering_3"
      rename = "sub_metering_3"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "is_missing"
      type = "bool"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "seq"
      type = "int"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "replay_time_ms"
      type = "int"

# ------------------------------------------- pipeline metrics (wall-clock time)
[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BOOTSTRAP}"]
  topics = ["energy.metrics"]
  consumer_group = "telegraf-metrics"
  offset = "newest"
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "pipeline_metric"
    timestamp_path = "metric_time_ms"
    timestamp_format = "unix_ms"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "run_id"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "component"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "name"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "instance"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"

# --------------------------------------------------- Telegraf's own health
[[inputs.internal]]
  collect_memstats = false

# ------------------------------------------------------------------ output
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

